<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jatinderveer Billing — Developer Passport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-navy:#1c2b45;
    --ink-navy-deep:#131f34;
    --page-cream:#f1e8d0;
    --page-cream-dim:#e9dfc4;
    --gold:#b8934f;
    --gold-bright:#d4b06a;
    --stamp-red:#a34640;
    --stamp-blue:#2b5c73;
    --stamp-green:#3f6b52;
    --stamp-plum:#6d4560;
    --text-dark:#2a2118;
    --text-mute:#6b5f4c;
    --rule:rgba(42,33,24,0.18);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% 20%, #24314d 0%, #131c2e 55%, #0c1220 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 16px 40px;
    font-family:'IBM Plex Mono', monospace;
    color:var(--page-cream);
  }

  .stage{ display:flex; flex-direction:column; align-items:center; gap:18px; width:100%; }

  .eyebrow-title{
    text-align:center;
    color:var(--gold-bright);
    letter-spacing:.28em;
    font-size:11px;
    text-transform:uppercase;
    opacity:.85;
    margin:0 0 -4px;
  }

  .book-wrap{
    perspective: 2400px;
    width:min(90vw, 380px);
  }

  .book{
    position:relative;
    width:100%;
    aspect-ratio: 5 / 7.1;
    border-radius:6px;
    box-shadow:
      0 30px 60px -18px rgba(0,0,0,0.65),
      0 8px 22px -6px rgba(0,0,0,0.5);
  }

  .stack-edge{
    position:absolute;
    top:4px; bottom:4px;
    right:-4px;
    width:100%;
    border-radius:6px;
    background: var(--page-cream-dim);
    border:1px solid rgba(42,33,24,0.25);
  }
  .stack-edge.e1{ transform: translate(3px,2px) rotate(0.6deg); z-index:1; opacity:.9;}
  .stack-edge.e2{ transform: translate(5px,4px) rotate(1.1deg); z-index:0; opacity:.75;}
  .stack-edge.e3{ transform: translate(7px,6px) rotate(1.6deg); z-index:-1; opacity:.6;}

  .page-static, .leaf{
    position:absolute;
    inset:0;
    border-radius:6px;
    overflow:hidden;
  }

  .understack{ z-index:2; }

  .leaf{
    z-index:4;
    transform-style: preserve-3d;
    transform-origin: left center;
    transform: rotateY(0deg);
    transition: transform 0.72s cubic-bezier(.62,.04,.38,.98);
  }
  @media (prefers-reduced-motion: reduce){
    .leaf{ transition-duration: .05s; }
  }

  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:6px;
    overflow:hidden;
  }
  .face.back{
    transform: rotateY(180deg);
    background:
      linear-gradient(115deg, transparent 45%, rgba(0,0,0,0.06) 46%, transparent 48%),
      var(--page-cream);
  }

  .nav-zone{
    position:absolute;
    bottom:0;
    width:17%;
    height:20%;
    z-index:10;
    background:transparent;
    border:none;
    padding:0;
    cursor:pointer;
  }
  .nav-zone.left{ left:0; }
  .nav-zone.right{ right:0; }
  .nav-zone:disabled{ cursor:default; }
  .nav-zone.right::after{
    content:"";
    position:absolute;
    right:0; bottom:0;
    width:0; height:0;
    border-style:solid;
    border-width:0 0 26px 26px;
    border-color:transparent transparent rgba(184,147,79,0) transparent;
    transition: border-color .25s ease;
  }
  .nav-zone.right:not(:disabled):hover::after{
    border-color:transparent transparent rgba(184,147,79,0.55) transparent;
  }

  /* ---------- Page content base ---------- */
  .pg{
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,255,255,0.15), transparent 55%),
      var(--page-cream);
    color:var(--text-dark);
    padding:20px 18px 16px;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
  }
  .pg::before{
    content:"";
    position:absolute; inset:0;
    box-shadow: inset 0 0 0 1px rgba(42,33,24,0.15), inset 10px 0 24px -18px rgba(0,0,0,0.35);
    pointer-events:none;
  }

  .eyebrow{
    font-size:9.5px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--text-mute);
    margin:0 0 2px;
  }
  .pg-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:17px;
    margin:0 0 10px;
    color:var(--ink-navy);
    border-bottom:1px solid var(--rule);
    padding-bottom:8px;
  }
  .pg-sub{
    font-size:10.5px;
    color:var(--text-mute);
    margin:-6px 0 12px;
    line-height:1.5;
  }

  /* ---------- Cover ---------- */
  .pg.cover{
    background:
      radial-gradient(ellipse at 50% 0%, #24345a 0%, transparent 60%),
      linear-gradient(160deg, var(--ink-navy) 0%, var(--ink-navy-deep) 100%);
    color:var(--gold-bright);
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:28px 20px 22px;
    gap:16px;
  }
  .pg.cover::before{ box-shadow: inset 0 0 0 1px rgba(212,176,106,0.25), inset 0 0 40px rgba(0,0,0,0.4);}
  .cover-rule{ width:60%; height:1px; background:rgba(212,176,106,0.4); flex:none; }
  .crest{ width:88px; height:88px; flex:none; }
  .crest-img{ width:88px; height:88px; flex:none; object-fit:contain; border-radius:6px; }
  .cover-title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:27px;
    letter-spacing:.16em;
    margin:0;
  }
  .cover-type{
    font-size:9.5px;
    letter-spacing:.3em;
    text-transform:uppercase;
    opacity:.75;
    margin-top:5px;
  }
  .cover-foot{
    font-size:8.5px; letter-spacing:.2em; opacity:.55;
    position:absolute; bottom:20px; left:0; right:0; text-align:center;
  }

  /* ---------- Bio page ---------- */
  .bio-grid{ display:flex; gap:14px; margin-bottom:10px; }
  .photo-box{
    position:relative;
    width:78px; height:96px;
    flex:none;
    border:1.5px dashed rgba(42,33,24,0.4);
    border-radius:2px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(42,33,24,0.03);
  }
  .photo-mono{
    font-family:'Fraunces', serif;
    font-size:26px;
    color:var(--ink-navy);
    opacity:.7;
  }
  .specimen{
    position:absolute;
    top:38%; left:50%;
    transform:translate(-50%,-50%) rotate(-18deg);
    font-size:9px;
    letter-spacing:.15em;
    color:var(--stamp-red);
    border:1.5px solid var(--stamp-red);
    padding:1px 6px;
    opacity:.75;
    white-space:nowrap;
  }
  .photo-label{
    text-align:center;
    font-size:7.5px;
    letter-spacing:.12em;
    color:var(--text-mute);
    margin-top:4px;
  }
  .data-fields{ flex:1; display:flex; flex-direction:column; gap:6px; }
  .field{ line-height:1.25; }
  .field .k{
    display:block;
    font-size:7.5px;
    letter-spacing:.14em;
    color:var(--text-mute);
    text-transform:uppercase;
  }
  .field .v{
    display:block;
    font-size:11px;
    font-weight:600;
    color:var(--ink-navy);
  }
  .field-row{ display:flex; gap:12px; flex-wrap:wrap; margin-top:2px; }
  .field-row .field{ flex:1; min-width:110px; }

  .field-links{ margin-top:9px; padding-top:7px; border-top:1px solid var(--rule); }
  .field-links .k{
    display:block;
    font-size:7.5px;
    letter-spacing:.14em;
    color:var(--text-mute);
    text-transform:uppercase;
    margin-bottom:3px;
  }
  .link-row{ display:flex; flex-wrap:wrap; align-items:center; gap:2px 0; }
  .link-row .sep{ color:var(--text-mute); font-size:9px; margin:0 6px; }
  .text-link{
    all:unset;
    box-sizing:border-box;
    cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    font-weight:500;
    color:var(--stamp-blue);
    border-bottom:1px dotted var(--stamp-blue);
    line-height:1.4;
    padding-bottom:1px;
  }
  .text-link:hover, .text-link:focus-visible{ color:var(--ink-navy); border-bottom-style:solid; }
  .text-link:focus-visible{ outline:1px solid var(--stamp-blue); outline-offset:2px; }

  .mrz{
    margin-top:auto;
    background:rgba(42,33,24,0.04);
    border-top:1px solid var(--rule);
    padding:9px 8px 4px;
    font-size:9.5px;
    letter-spacing:.08em;
    line-height:1.6;
    white-space:pre;
    color:var(--ink-navy);
    overflow-x:auto;
  }

  /* ---------- Visa / stamp pages ---------- */
  .pg.visa{
    background:
      repeating-linear-gradient(115deg, rgba(43,92,115,0.05) 0px, rgba(43,92,115,0.05) 1px, transparent 1px, transparent 13px),
      var(--page-cream);
  }
  .stamp-grid{
    flex:1;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px 10px;
    align-content:start;
    margin-top:6px;
  }
  .stamp{
    position:relative;
    border:1.5px solid var(--ink-color, var(--stamp-blue));
    border-radius:50%;
    aspect-ratio:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8px 6px;
    color:var(--ink-color, var(--stamp-blue));
    transform:rotate(var(--rot, -4deg));
    background: radial-gradient(circle, rgba(255,255,255,0.3), transparent 70%);
  }
  .stamp::before{
    content:"";
    position:absolute; inset:4px;
    border:1px dashed var(--ink-color, var(--stamp-blue));
    border-radius:50%;
    opacity:.55;
  }
  .stamp .flag{ width:30px; height:20px; margin-bottom:4px; border:1px solid rgba(0,0,0,0.2); }
  .stamp .icon{ width:28px; height:28px; margin-bottom:4px; }
  .stamp .lbl{ font-family:'Fraunces', serif; font-weight:600; font-size:10.5px; letter-spacing:.02em; line-height:1.1;}
  .stamp .sub{ font-size:6.5px; letter-spacing:.1em; text-transform:uppercase; margin-top:2px; opacity:.85; }
  .stamp .arc{ font-size:6px; letter-spacing:.16em; text-transform:uppercase; margin-top:3px; opacity:.7; }

  /* ---------- Employment page ---------- */
  .endorse-item{
    border:1px solid var(--rule);
    border-radius:4px;
    padding:10px 10px 10px 12px;
    margin-bottom:10px;
    display:flex;
    gap:10px;
    align-items:flex-start;
    background:rgba(255,255,255,0.25);
  }
  .endorse-icon{ width:30px; height:30px; flex:none; color:var(--ink-navy); opacity:.85; }
  .endorse-title{ font-family:'Fraunces', serif; font-weight:600; font-size:12px; color:var(--ink-navy); margin:0 0 2px; }
  .endorse-desc{ font-size:9.5px; color:var(--text-mute); line-height:1.5; margin:0; }
  .endorse-stamp{
    display:inline-block;
    margin-top:5px;
    font-size:8px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--stamp-green);
    border:1px solid var(--stamp-green);
    padding:2px 6px;
    border-radius:2px;
  }

  /* ---------- Back cover ---------- */
  .pg.back-cvr{
    background:
      radial-gradient(ellipse at 50% 100%, #24345a 0%, transparent 60%),
      linear-gradient(200deg, var(--ink-navy) 0%, var(--ink-navy-deep) 100%);
    color:var(--gold-bright);
    justify-content:center;
    align-items:center;
    text-align:center;
    gap:10px;
  }
  .back-cvr .end-label{ font-size:9px; letter-spacing:.3em; opacity:.6; margin-bottom:10px; }
  .back-thanks{ font-family:'Fraunces', serif; font-size:16px; margin:0 0 4px; }
  .back-note{ font-size:9.5px; opacity:.65; max-width:220px; line-height:1.6; margin:0; }
  .return-btn{
    all:unset;
    box-sizing:border-box;
    cursor:pointer;
    margin-top:18px;
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    letter-spacing:.06em;
    color:var(--gold-bright);
    border:1px solid rgba(212,176,106,0.45);
    border-radius:20px;
    padding:8px 18px;
    transition: background .2s ease, transform .15s ease;
  }
  .return-btn:hover{ background:rgba(212,176,106,0.15); }
  .return-btn:active{ transform:scale(0.96); }
  .return-btn:focus-visible{ outline:1px solid var(--gold-bright); outline-offset:2px; }

  /* ---------- Controls ---------- */
  .controls{ display:flex; align-items:center; gap:16px; }
  .ctrl-btn{
    width:36px; height:36px;
    border-radius:50%;
    border:1px solid rgba(212,176,106,0.5);
    background:rgba(212,176,106,0.08);
    color:var(--gold-bright);
    font-size:18px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .2s ease, transform .15s ease;
  }
  .ctrl-btn:hover:not(:disabled){ background:rgba(212,176,106,0.2); }
  .ctrl-btn:active:not(:disabled){ transform:scale(0.94); }
  .ctrl-btn:disabled{ opacity:.3; cursor:default; }
  .ctrl-btn:focus-visible, .nav-zone:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:2px; }
  .page-indicator{ font-size:11px; letter-spacing:.15em; color:var(--gold-bright); opacity:.8; min-width:52px; text-align:center; }
  .hint{ font-size:10px; letter-spacing:.05em; color:rgba(241,232,208,0.45); margin:2px 0 0; text-align:center; }

  @media (max-width:420px){
    .book-wrap{ width:min(86vw, 340px); }
  }
</style>
</head>
<body>

  <p class="eyebrow-title">Career Passport</p>
<br>
  <div class="stage">
    <div class="book-wrap">
      <div class="book" id="book">
        <div class="stack-edge e3"></div>
        <div class="stack-edge e2"></div>
        <div class="stack-edge e1"></div>
        <div class="page-static understack" id="understack"></div>
        <div class="leaf" id="leaf">
          <div class="face front" id="leafFront"></div>
          <div class="face back"></div>
        </div>
        <button class="nav-zone left" id="zoneLeft" aria-label="Previous page"></button>
        <button class="nav-zone right" id="zoneRight" aria-label="Next page"></button>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="prevBtn" aria-label="Previous page">‹</button>
      <div class="page-indicator" id="pageIndicator">1 / 6</div>
      <button class="ctrl-btn" id="nextBtn" aria-label="Next page">›</button>
    </div>
    <p class="hint">Click the corner fold, tap the arrows, or use ← →</p>
  </div>

  const pages = [
    {type:'cover', html: coverHTML},

  // ---------- flip engine ----------
  const leaf = document.getElementById('leaf');
  const leafFront = document.getElementById('leafFront');
  const understack = document.getElementById('understack');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const zoneLeft = document.getElementById('zoneLeft');
  const zoneRight = document.getElementById('zoneRight');
  const indicator = document.getElementById('pageIndicator');

  const total = pages.length;
  let current = 0;
  let animating = false;

  function setFace(el, index, isLeaf){
    if(index < 0 || index >= total){ el.innerHTML = ''; return; }
    el.innerHTML = pages[index].html;
  }

  function updateUI(){
    indicator.textContent = (current + 1) + ' / ' + total;
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === total - 1;
    zoneLeft.disabled = current === 0;
    zoneRight.disabled = current === total - 1;
  }

  setFace(leafFront, 0);
  setFace(understack, 1);
  updateUI();

  function goNext(){
    if(animating || current >= total - 1) return;
    animating = true;
    leaf.style.transform = 'rotateY(-180deg)';
    const onEnd = (e) => {
      if(e.propertyName !== 'transform') return;
      leaf.removeEventListener('transitionend', onEnd);
      current++;
      leaf.style.transition = 'none';
      leaf.style.transform = 'rotateY(0deg)';
      setFace(leafFront, current);
      setFace(understack, current + 1);
      void leaf.offsetHeight;
      leaf.style.transition = '';
      animating = false;
      updateUI();
    };
    leaf.addEventListener('transitionend', onEnd);
  }

  function goPrev(){
    if(animating || current <= 0) return;
    animating = true;
    leaf.style.transition = 'none';
    setFace(leafFront, current - 1);
    setFace(understack, current);
    leaf.style.transform = 'rotateY(-180deg)';
    void leaf.offsetHeight;
    leaf.style.transition = '';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        leaf.style.transform = 'rotateY(0deg)';
      });
    });
    const onEnd = (e) => {
      if(e.propertyName !== 'transform') return;
      leaf.removeEventListener('transitionend', onEnd);
      current--;
      setFace(understack, current + 1);
      animating = false;
      updateUI();
    };
    leaf.addEventListener('transitionend', onEnd);
  }

  function jumpTo(index){
    if(animating || index === current || index < 0 || index >= total) return;
    animating = true;
    leaf.style.transition = 'opacity .26s ease';
    leaf.style.opacity = '0';
    setTimeout(() => {
      leaf.style.transition = 'none';
      leaf.style.transform = 'rotateY(0deg)';
      current = index;
      setFace(leafFront, current);
      setFace(understack, current + 1);
      void leaf.offsetHeight;
      leaf.style.transition = 'opacity .26s ease';
      leaf.style.opacity = '1';
      updateUI();
      setTimeout(() => {
        leaf.style.transition = '';
        animating = false;
      }, 280);
    }, 260);
  }

  prevBtn.addEventListener('click', goPrev);
  nextBtn.addEventListener('click', goNext);
  zoneLeft.addEventListener('click', goPrev);
  zoneRight.addEventListener('click', goNext);
  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowRight') goNext();
    if(e.key === 'ArrowLeft') goPrev();
  });
  document.addEventListener('click', (e) => {
    const target = e.target.closest('[data-goto]');
    if(target){ jumpTo(parseInt(target.dataset.goto, 10)); }
  });
